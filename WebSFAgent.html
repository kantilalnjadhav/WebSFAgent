<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mutual Fund AI Agent</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background:#f5f7fb;
        }

        .container{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            text-align:center;
            padding:20px;
        }

        .content h1{
            font-size:48px;
            color:#1565c0;
            margin-bottom:20px;
        }

        .content p{
            font-size:18px;
            color:#555;
            max-width:700px;
            line-height:1.6;
        }

        .chat-note{
            margin-top:25px;
            font-size:15px;
            color:#777;
        }

        /* Small floating message box */
        .floating-msg{
            position:fixed;
            bottom:90px;
            right:20px;
            background:white;
            padding:12px 16px;
            border-radius:12px;
            box-shadow:0 4px 10px rgba(0,0,0,0.15);
            font-size:14px;
            color:#333;
            animation:float 2s infinite ease-in-out;
        }

        @keyframes float{
            0%{transform:translateY(0px);}
            50%{transform:translateY(-5px);}
            100%{transform:translateY(0px);}
        }

    </style>
</head>

<body>

    <div class="container">
        <div class="content">
            <h1>Mutual Fund AI Assistant</h1>

            <p>
                Ask questions about SIP, NAV, portfolio details,
                investment plans, and customer support using our
                Salesforce Agentforce AI Assistant.
            </p>

            <div class="chat-note">
                Chat icon available in the bottom-right corner →
            </div>
        </div>
    </div>

    <!-- Small Message Popup -->
    <div class="floating-msg">
        👋 Need help? Chat with us
    </div>
